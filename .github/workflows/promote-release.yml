name: Promote tested Atm4x release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Tested Atm4x release tag (for example v2026.09.06.3)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: promote-release-${{ github.repository }}
  cancel-in-progress: false

env:
  SOURCE_REPO: Atm4x/NeuroMita
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  promote:
    name: Promote ${{ inputs.source_tag }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VinerX/main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install archive tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          7z i >/dev/null

      - name: Capture VinerX base commit
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare isolated promotion workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail

          PROMOTE_DIR="$RUNNER_TEMP/neuromita-promote-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$PROMOTE_DIR"
          mkdir -p "$PROMOTE_DIR"

          echo "dir=$PROMOTE_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Unity archive password secret
        shell: bash
        env:
          TESTER_CODE: ${{ secrets.TESTER_CODE }}
        run: |
          set -euo pipefail

          if [ -z "${TESTER_CODE:-}" ]; then
            echo "Repository secret TESTER_CODE is missing or empty."
            echo "It is required to unpack the protected Atm4x UnityBuild archive."
            exit 1
          fi

      - name: Resolve tested Atm4x release
        id: source
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          PROMOTE_DIR: ${{ steps.workspace.outputs.dir }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          source_repo = os.environ["SOURCE_REPO"].strip()
          source_tag = os.environ["SOURCE_TAG"].strip()
          promote_dir = Path(os.environ["PROMOTE_DIR"])

          if not re.fullmatch(
              r"v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(?:\.[0-9]+)?",
              source_tag,
          ):
              raise SystemExit(
                  f"Unsupported source tag {source_tag!r}; "
                  "expected vYYYY.MM.DD or vYYYY.MM.DD.N"
              )

          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "NeuroMita-promote-workflow",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          token = os.environ.get("GH_TOKEN", "").strip()
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(
                      f"GitHub API failed: HTTP {exc.code} for {url}: "
                      f"{body[:500]}"
                  ) from exc

          encoded_tag = urllib.parse.quote(source_tag, safe="")

          release = get_json(
              f"https://api.github.com/repos/"
              f"{source_repo}/releases/tags/{encoded_tag}"
          )

          if release.get("draft"):
              raise SystemExit(
                  f"Source release {source_tag} is still a draft"
              )

          if release.get("prerelease"):
              raise SystemExit(
                  f"Source release {source_tag} is marked as prerelease; "
                  "Promote expects a published tested Atm4x release"
              )

          if not release.get("published_at"):
              raise SystemExit(
                  f"Source release {source_tag} is not published"
              )

          commit = get_json(
              f"https://api.github.com/repos/"
              f"{source_repo}/commits/{encoded_tag}"
          )

          source_commit = str(commit.get("sha") or "").strip().lower()

          if not re.fullmatch(r"[0-9a-f]{40}", source_commit):
              raise SystemExit(
                  f"Could not resolve source commit for "
                  f"{source_tag}: {source_commit!r}"
              )

          expected_python_name = f"PythonBuild-{source_tag}.zip"
          expected_unity_name = f"UnityBuild-{source_tag}.zip"

          release_assets = list(release.get("assets") or [])

          def resolve_asset(expected_name: str) -> dict:
              matches = [
                  asset
                  for asset in release_assets
                  if str(asset.get("name") or "").strip() == expected_name
              ]

              if len(matches) != 1:
                  names = [
                      str(asset.get("name") or "")
                      for asset in release_assets
                  ]
                  raise SystemExit(
                      f"Expected exactly one {expected_name!r} in "
                      f"{source_repo} {source_tag}; found {len(matches)}. "
                      f"Assets: {names}"
                  )

              asset = matches[0]
              url = str(
                  asset.get("browser_download_url") or ""
              ).strip()
              digest = str(
                  asset.get("digest") or ""
              ).strip().lower()

              if not url.startswith("https://github.com/"):
                  raise SystemExit(
                      f"Unexpected release asset URL "
                      f"for {expected_name}: {url}"
                  )

              if digest and not re.fullmatch(
                  r"sha256:[0-9a-f]{64}",
                  digest,
              ):
                  raise SystemExit(
                      f"Unexpected release asset digest "
                      f"for {expected_name}: {digest!r}"
                  )

              return {
                  "name": expected_name,
                  "url": url,
                  "digest": digest,
                  "size": int(asset.get("size") or 0),
              }

          python_asset = resolve_asset(expected_python_name)
          unity_asset = resolve_asset(expected_unity_name)

          source_data = {
              "tag": source_tag,
              "name": (
                  release.get("name")
                  or f"NeuroMita {source_tag}"
              ),
              "body": release.get("body") or "",
              "source_commit": source_commit,
              "python": python_asset,
              "unity": unity_asset,
          }

          (promote_dir / "source-release.json").write_text(
              json.dumps(
                  source_data,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          github_output = Path(os.environ["GITHUB_OUTPUT"])

          with github_output.open("a", encoding="utf-8") as out:
              out.write(f"source_tag={source_tag}\n")
              out.write(f"source_commit={source_commit}\n")

              out.write(
                  f"python_name={python_asset['name']}\n"
              )
              out.write(
                  f"python_url={python_asset['url']}\n"
              )
              out.write(
                  f"python_digest={python_asset['digest']}\n"
              )

              out.write(
                  f"unity_name={unity_asset['name']}\n"
              )
              out.write(
                  f"unity_url={unity_asset['url']}\n"
              )
              out.write(
                  f"unity_digest={unity_asset['digest']}\n"
              )

          print(
              f"Source release: {source_repo} {source_tag}"
          )
          print(
              f"Source commit:  {source_commit}"
          )
          print(
              f"Python asset:   {python_asset['name']}"
          )
          print(
              f"Unity asset:    {unity_asset['name']}"
          )
          PY

      - name: Refuse duplicate VinerX tag or release
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git ls-remote \
              --exit-code \
              --tags \
              origin \
              "refs/tags/$SOURCE_TAG" \
              >/dev/null 2>&1; then

            echo "Tag $SOURCE_TAG already exists in VinerX/NeuroMita."
            echo "Refusing to overwrite it."
            exit 1
          fi

          RELEASE_TAGS="$(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[].tag_name'
          )"

          if grep -Fxq "$SOURCE_TAG" <<< "$RELEASE_TAGS"; then
            echo "A VinerX release (including a draft) already exists for $SOURCE_TAG."
            echo "Delete the old draft/release before rerunning Promote."
            exit 1
          fi

      - name: Download tested artifacts from Atm4x
        id: download
        shell: bash
        env:
          PYTHON_NAME: ${{ steps.source.outputs.python_name }}
          PYTHON_URL: ${{ steps.source.outputs.python_url }}
          PYTHON_DIGEST: ${{ steps.source.outputs.python_digest }}
          UNITY_NAME: ${{ steps.source.outputs.unity_name }}
          UNITY_URL: ${{ steps.source.outputs.unity_url }}
          UNITY_DIGEST: ${{ steps.source.outputs.unity_digest }}
          PROMOTE_DIR: ${{ steps.workspace.outputs.dir }}
        run: |
          set -euo pipefail

          download_and_verify() {
            local name="$1"
            local url="$2"
            local digest="$3"
            local output="$4"

            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-all-errors \
              --output "$output" \
              "$url"

            test -s "$output"

            local actual_sha
            actual_sha="$(
              sha256sum "$output" |
              awk '{print $1}'
            )"

            if [ -n "$digest" ]; then
              local expected_sha="${digest#sha256:}"

              if [ "$actual_sha" != "$expected_sha" ]; then
                echo "$name digest mismatch."
                echo "Expected: $expected_sha"
                echo "Actual:   $actual_sha"
                exit 1
              fi
            fi

            echo "$name sha256=$actual_sha"
          }

          PYTHON_PATH="$PROMOTE_DIR/$PYTHON_NAME"
          UNITY_SOURCE_PATH="$PROMOTE_DIR/source-$UNITY_NAME"

          download_and_verify \
            "$PYTHON_NAME" \
            "$PYTHON_URL" \
            "$PYTHON_DIGEST" \
            "$PYTHON_PATH"

          download_and_verify \
            "$UNITY_NAME" \
            "$UNITY_URL" \
            "$UNITY_DIGEST" \
            "$UNITY_SOURCE_PATH"

      - name: Verify Python source artifact provenance
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          PYTHON_NAME: ${{ steps.source.outputs.python_name }}
          PROMOTE_DIR: ${{ steps.workspace.outputs.dir }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          promote_dir = Path(os.environ["PROMOTE_DIR"])
          archive_path = (
              promote_dir /
              os.environ["PYTHON_NAME"]
          )

          source_tag = os.environ["SOURCE_TAG"]
          source_commit = (
              os.environ["SOURCE_COMMIT"]
              .strip()
              .lower()
          )
          source_repo = os.environ["SOURCE_REPO"]

          def is_marker(name: str) -> bool:
              normalized = (
                  name
                  .replace("\\", "/")
                  .strip("/")
                  .casefold()
              )

              marker = "settings/distribution.json"

              return (
                  normalized == marker
                  or normalized.endswith("/" + marker)
              )

          with zipfile.ZipFile(archive_path, "r") as archive:
              marker_names = [
                  info.filename
                  for info in archive.infolist()
                  if (
                      not info.is_dir()
                      and is_marker(info.filename)
                  )
              ]

              if len(marker_names) != 1:
                  raise SystemExit(
                      "Expected exactly one "
                      "Settings/distribution.json; "
                      f"found {marker_names}"
                  )

              marker = json.loads(
                  archive.read(
                      marker_names[0]
                  ).decode("utf-8")
              )

              expected = {
                  "schema": 1,
                  "contour": "test",
                  "source_repo": source_repo,
                  "source_tag": source_tag,
                  "source_commit": source_commit,
              }

              actual = {
                  "schema": marker.get("schema"),
                  "contour": str(
                      marker.get("contour") or ""
                  ).strip().casefold(),
                  "source_repo": str(
                      marker.get("source_repo") or ""
                  ).strip(),
                  "source_tag": str(
                      marker.get("source_tag") or ""
                  ).strip(),
                  "source_commit": str(
                      marker.get("source_commit") or ""
                  ).strip().lower(),
              }

              if actual != expected:
                  raise SystemExit(
                      "Source distribution marker does not match "
                      "the tested Atm4x release:\n"
                      + json.dumps(
                          {
                              "expected": expected,
                              "actual": actual,
                          },
                          indent=2,
                      )
                  )

              pyz_hashes = {}

              for info in archive.infolist():
                  if (
                      info.is_dir()
                      or not info.filename
                      .casefold()
                      .endswith(".pyz")
                  ):
                      continue

                  digest = hashlib.sha256()

                  with archive.open(info, "r") as stream:
                      while True:
                          chunk = stream.read(
                              1024 * 1024
                          )

                          if not chunk:
                              break

                          digest.update(chunk)

                  pyz_hashes[
                      info.filename
                  ] = digest.hexdigest()

              if not pyz_hashes:
                  raise SystemExit(
                      "No .pyz artifact found "
                      "in the tested Python ZIP"
                  )

          (
              promote_dir /
              "pyz-before.json"
          ).write_text(
              json.dumps(
                  pyz_hashes,
                  sort_keys=True,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          print(
              "Verified source marker: contour=test"
          )

          for name, digest in pyz_hashes.items():
              print(
                  f"Source .pyz: "
                  f"{name} sha256={digest}"
              )
          PY

      - name: Stamp production Python distribution metadata
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          PYTHON_NAME: ${{ steps.source.outputs.python_name }}
          PROMOTE_DIR: ${{ steps.workspace.outputs.dir }}
        run: |
          set -euo pipefail

          test -f scripts/stamp_distribution_metadata.py || {
            echo "scripts/stamp_distribution_metadata.py is missing in VinerX/main."
            exit 1
          }

          python scripts/stamp_distribution_metadata.py \
            --archive "$PROMOTE_DIR/$PYTHON_NAME" \
            --contour release \
            --source-repo "$SOURCE_REPO" \
            --source-tag "$SOURCE_TAG" \
            --source-commit "$SOURCE_COMMIT"

      - name: Verify production Python artifact
        id: python_final
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          PYTHON_NAME: ${{ steps.source.outputs.python_name }}
          PROMOTE_DIR: ${{ steps.workspace.outputs.dir }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          promote_dir = Path(os.environ["PROMOTE_DIR"])
          archive_path = (
              promote_dir /
              os.environ["PYTHON_NAME"]
          )

          source_tag = os.environ["SOURCE_TAG"]
          source_commit = (
              os.environ["SOURCE_COMMIT"]
              .strip()
              .lower()
          )
          source_repo = os.environ["SOURCE_REPO"]

          before = json.loads(
              (
                  promote_dir /
                  "pyz-before.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          def is_marker(name: str) -> bool:
              normalized = (
                  name
                  .replace("\\", "/")
                  .strip("/")
                  .casefold()
              )

              marker = "settings/distribution.json"

              return (
                  normalized == marker
                  or normalized.endswith("/" + marker)
              )

          with zipfile.ZipFile(archive_path, "r") as archive:
              marker_names = [
                  info.filename
                  for info in archive.infolist()
                  if (
                      not info.is_dir()
                      and is_marker(info.filename)
                  )
              ]

              if len(marker_names) != 1:
                  raise SystemExit(
                      "Expected exactly one final "
                      "Settings/distribution.json; "
                      f"found {marker_names}"
                  )

              marker = json.loads(
                  archive.read(
                      marker_names[0]
                  ).decode("utf-8")
              )

              expected_marker = {
                  "schema": 1,
                  "contour": "release",
                  "source_repo": source_repo,
                  "source_tag": source_tag,
                  "source_commit": source_commit,
              }

              actual_marker = {
                  "schema": marker.get("schema"),
                  "contour": str(
                      marker.get("contour") or ""
                  ).strip().casefold(),
                  "source_repo": str(
                      marker.get("source_repo") or ""
                  ).strip(),
                  "source_tag": str(
                      marker.get("source_tag") or ""
                  ).strip(),
                  "source_commit": str(
                      marker.get("source_commit") or ""
                  ).strip().lower(),
              }

              if actual_marker != expected_marker:
                  raise SystemExit(
                      "Final distribution marker is invalid:\n"
                      + json.dumps(
                          {
                              "expected": expected_marker,
                              "actual": actual_marker,
                          },
                          indent=2,
                      )
                  )

              after = {}

              for info in archive.infolist():
                  if (
                      info.is_dir()
                      or not info.filename
                      .casefold()
                      .endswith(".pyz")
                  ):
                      continue

                  digest = hashlib.sha256()

                  with archive.open(info, "r") as stream:
                      while True:
                          chunk = stream.read(
                              1024 * 1024
                          )

                          if not chunk:
                              break

                          digest.update(chunk)

                  after[
                      info.filename
                  ] = digest.hexdigest()

          if before != after:
              raise SystemExit(
                  "Embedded .pyz changed during Promote:\n"
                  + json.dumps(
                      {
                          "before": before,
                          "after": after,
                      },
                      indent=2,
                  )
              )

          archive_sha = hashlib.sha256(
              archive_path.read_bytes()
          ).hexdigest()

          (
              promote_dir /
              "python-promoted.sha256"
          ).write_text(
              archive_sha + "\n",
              encoding="utf-8",
          )

          print(
              "Verified final marker: contour=release"
          )

          for name, digest in after.items():
              print(
                  f"Unchanged .pyz: "
                  f"{name} sha256={digest}"
              )

          print(
              f"Promoted Python ZIP "
              f"sha256={archive_sha}"
          )
          PY

      - name: Validate final Python release contract
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          PYTHON_NAME: ${{ steps.source.outputs.python_name }}
          PROMOTE_DIR: ${{ steps.workspace.outputs.dir }}
        run: |
          set -euo pipefail

          test -f scripts/validate_release_contract.py || {
            echo "scripts/validate_release_contract.py is missing in VinerX/main."
            exit 1
          }

          python scripts/validate_release_contract.py \
            --tag "$SOURCE_TAG" \
            --asset "$PROMOTE_DIR/$PYTHON_NAME"

      - name: Repack Unity build without password and verify content
        id: unity_final
        shell: bash
        env:
          UNITY_NAME: ${{ steps.source.outputs.unity_name }}
          PROMOTE_DIR: ${{ steps.workspace.outputs.dir }}
          TESTER_CODE: ${{ secrets.TESTER_CODE }}
        run: |
          set -euo pipefail

          SOURCE_ZIP="$PROMOTE_DIR/source-$UNITY_NAME"
          OUTPUT_ZIP="$PROMOTE_DIR/$UNITY_NAME"
          EXTRACT_DIR="$PROMOTE_DIR/unity-source"

          rm -rf "$EXTRACT_DIR" "$OUTPUT_ZIP"
          mkdir -p "$EXTRACT_DIR"

          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path, PurePosixPath

          source_zip = (
              Path(os.environ["PROMOTE_DIR"])
              / f"source-{os.environ['UNITY_NAME']}"
          )

          encrypted = 0
          file_count = 0

          with zipfile.ZipFile(source_zip, "r") as archive:
              for info in archive.infolist():
                  raw_name = (
                      info.filename
                      .replace("\\", "/")
                  )

                  path = PurePosixPath(raw_name)

                  if (
                      raw_name.startswith("/")
                      or ".." in path.parts
                      or "\x00" in raw_name
                  ):
                      raise SystemExit(
                          f"Unsafe path in Unity ZIP: "
                          f"{info.filename!r}"
                      )

                  if not info.is_dir():
                      file_count += 1

                  if info.flag_bits & 0x1:
                      encrypted += 1

          if file_count == 0:
              raise SystemExit(
                  "Unity source ZIP contains no files"
              )

          print(
              f"Unity source ZIP: "
              f"{file_count} files, "
              f"{encrypted} encrypted entries"
          )
          PY

          # Decrypt/extract with the repository secret.
          # No shell tracing is enabled, so the password is not printed.
          7z x \
            -y \
            -p"$TESTER_CODE" \
            -o"$EXTRACT_DIR" \
            "$SOURCE_ZIP" \
            >/dev/null

          # Hash the extracted source files, repack them as an ordinary
          # password-free ZIP, then compare every file inside the new ZIP.
          python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import zipfile
          from pathlib import Path

          promote_dir = Path(
              os.environ["PROMOTE_DIR"]
          )

          root = (
              promote_dir /
              "unity-source"
          )

          output_zip = (
              promote_dir /
              os.environ["UNITY_NAME"]
          )

          def file_sha256(path: Path) -> str:
              digest = hashlib.sha256()

              with path.open("rb") as stream:
                  while True:
                      chunk = stream.read(
                          1024 * 1024
                      )

                      if not chunk:
                          break

                      digest.update(chunk)

              return digest.hexdigest()

          before = {}

          all_paths = sorted(
              root.rglob("*"),
              key=lambda p: p.as_posix().casefold(),
          )

          for path in all_paths:
              if path.is_symlink():
                  raise SystemExit(
                      f"Refusing to repack symlink: "
                      f"{path.relative_to(root)}"
                  )

              if not path.is_file():
                  continue

              relative = (
                  path.relative_to(root)
                  .as_posix()
              )

              before[relative] = {
                  "size": path.stat().st_size,
                  "sha256": file_sha256(path),
              }

          if not before:
              raise SystemExit(
                  "Extracted Unity build contains no files"
              )

          with zipfile.ZipFile(
              output_zip,
              "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=6,
              allowZip64=True,
          ) as archive:

              for path in all_paths:
                  if not path.is_file():
                      continue

                  relative = (
                      path.relative_to(root)
                      .as_posix()
                  )

                  archive.write(
                      path,
                      arcname=relative,
                  )

          after = {}

          with zipfile.ZipFile(
              output_zip,
              "r",
          ) as archive:

              names_seen = set()

              for info in archive.infolist():
                  if info.is_dir():
                      continue

                  if info.flag_bits & 0x1:
                      raise SystemExit(
                          "Production Unity ZIP still "
                          f"contains encrypted entry: "
                          f"{info.filename}"
                      )

                  if info.filename in names_seen:
                      raise SystemExit(
                          "Duplicate path in production "
                          f"Unity ZIP: {info.filename}"
                      )

                  names_seen.add(info.filename)

                  digest = hashlib.sha256()

                  with archive.open(info, "r") as stream:
                      while True:
                          chunk = stream.read(
                              1024 * 1024
                          )

                          if not chunk:
                              break

                          digest.update(chunk)

                  after[info.filename] = {
                      "size": info.file_size,
                      "sha256": digest.hexdigest(),
                  }

          if before != after:
              before_names = set(before)
              after_names = set(after)

              changed = sorted(
                  name
                  for name in (
                      before_names &
                      after_names
                  )
                  if before[name] != after[name]
              )

              raise SystemExit(
                  "Unity content changed while "
                  "removing ZIP protection.\n"
                  f"Missing: "
                  f"{sorted(before_names - after_names)[:20]}\n"
                  f"Added: "
                  f"{sorted(after_names - before_names)[:20]}\n"
                  f"Changed: {changed[:20]}"
              )

          source_sha = hashlib.sha256(
              (
                  promote_dir /
                  f"source-{os.environ['UNITY_NAME']}"
              ).read_bytes()
          ).hexdigest()

          release_sha = hashlib.sha256(
              output_zip.read_bytes()
          ).hexdigest()

          meta = {
              "file_count": len(before),
              "source_archive_sha256": source_sha,
              "release_archive_sha256": release_sha,
              "content_identity_verified": True,
              "release_archive_encrypted": False,
          }

          (
              promote_dir /
              "unity-meta.json"
          ).write_text(
              json.dumps(
                  meta,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          print(
              f"Verified {len(before)} Unity files: "
              "content-identical after repack."
          )
          print(
              "Production Unity ZIP contains "
              "no encrypted entries."
          )
          print(
              f"Production Unity ZIP "
              f"sha256={release_sha}"
          )
          PY

      - name: Build promoted archive checksums
        shell: bash
        env:
          PYTHON_NAME: ${{ steps.source.outputs.python_name }}
          UNITY_NAME: ${{ steps.source.outputs.unity_name }}
          PROMOTE_DIR: ${{ steps.workspace.outputs.dir }}
        run: |
          set -euo pipefail

          (
            cd "$PROMOTE_DIR"
            sha256sum \
              "$PYTHON_NAME" \
              "$UNITY_NAME" \
              > promoted-archive.sha256
          )

          cat "$PROMOTE_DIR/promoted-archive.sha256"

      - name: Build production release notes
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          PYTHON_NAME: ${{ steps.source.outputs.python_name }}
          UNITY_NAME: ${{ steps.source.outputs.unity_name }}
          PROMOTE_DIR: ${{ steps.workspace.outputs.dir }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          promote_dir = Path(
              os.environ["PROMOTE_DIR"]
          )

          source = json.loads(
              (
                  promote_dir /
                  "source-release.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          pyz_hashes = json.loads(
              (
                  promote_dir /
                  "pyz-before.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          unity_meta = json.loads(
              (
                  promote_dir /
                  "unity-meta.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          lines = [
              "Promoted from the tested Atm4x release artifacts.",
              "",
              (
                  "- Source repository: "
                  f"`{os.environ['SOURCE_REPO']}`"
              ),
              (
                  "- Source tag: "
                  f"`{os.environ['SOURCE_TAG']}`"
              ),
              (
                  "- Tested source commit: "
                  f"`{os.environ['SOURCE_COMMIT']}`"
              ),
              (
                  "- Embedded Python artifact: "
                  "byte-identical to the tested "
                  "Atm4x build"
              ),
              (
                  "- Unity build: extracted with "
                  "the test archive secret and "
                  "repacked without a password; "
                  "file contents verified identical"
              ),
              "",
              "Embedded `.pyz` SHA256:",
          ]

          for name, digest in sorted(
              pyz_hashes.items()
          ):
              lines.append(
                  f"- `{name}`: `{digest}`"
              )

          lines.extend(
              [
                  "",
                  "Promoted artifacts:",
                  (
                      f"- `{os.environ['PYTHON_NAME']}`"
                  ),
                  (
                      f"- `{os.environ['UNITY_NAME']}` "
                      f"({unity_meta['file_count']} "
                      "files verified)"
                  ),
              ]
          )

          body = str(
              source.get("body") or ""
          ).strip()

          if body:
              lines.extend(
                  [
                      "",
                      "---",
                      "",
                      body,
                  ]
              )

          (
              promote_dir /
              "RELEASE_BODY.md"
          ).write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build preview release manifest
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          PYTHON_NAME: ${{ steps.source.outputs.python_name }}
          UNITY_NAME: ${{ steps.source.outputs.unity_name }}
          PROMOTE_DIR: ${{ steps.workspace.outputs.dir }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test -f src/services/release_catalog.py || {
            echo "src/services/release_catalog.py is missing in VinerX/main."
            exit 1
          }

          python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(
              0,
              str(root / "src"),
          )

          from services.release_catalog import (
              build_release_manifest,
              parse_release_manifest,
          )

          repository = os.environ[
              "GITHUB_REPOSITORY"
          ].strip()

          source_tag = os.environ[
              "SOURCE_TAG"
          ].strip()

          promote_dir = Path(
              os.environ["PROMOTE_DIR"]
          )

          token = os.environ.get(
              "GITHUB_TOKEN",
              "",
          ).strip()

          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "NeuroMita-preview-manifest",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          if token:
              headers["Authorization"] = (
                  f"Bearer {token}"
              )

          releases = []
          page = 1

          while True:
              query = urllib.parse.urlencode(
                  {
                      "per_page": 100,
                      "page": page,
                  }
              )

              url = (
                  "https://api.github.com/repos/"
                  f"{repository}/releases?{query}"
              )

              request = urllib.request.Request(
                  url,
                  headers=headers,
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30,
                  ) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode(
                      "utf-8",
                      errors="replace",
                  )

                  raise SystemExit(
                      f"GitHub API failed: "
                      f"HTTP {exc.code}: "
                      f"{body[:500]}"
                  ) from exc

              if not isinstance(payload, list):
                  raise SystemExit(
                      "GitHub releases API "
                      "did not return a list"
                  )

              releases.extend(payload)

              if len(payload) < 100:
                  break

              page += 1

          # The duplicate check should already have caught this,
          # but do not let a stale same-tag release enter the preview.
          releases = [
              release
              for release in releases
              if str(
                  release.get("tag_name") or ""
              ).strip() != source_tag
          ]

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()

              with path.open("rb") as stream:
                  while True:
                      chunk = stream.read(
                          1024 * 1024
                      )

                      if not chunk:
                          break

                      digest.update(chunk)

              return digest.hexdigest()

          def local_asset(
              name: str,
              content_type: str,
          ) -> dict:
              path = promote_dir / name

              if not path.is_file():
                  raise SystemExit(
                      f"Preview asset is missing: "
                      f"{path}"
                  )

              encoded_tag = urllib.parse.quote(
                  source_tag,
                  safe="",
              )

              encoded_name = urllib.parse.quote(
                  name,
                  safe="",
              )

              return {
                  "name": name,
                  "browser_download_url": (
                      f"https://github.com/"
                      f"{repository}/releases/"
                      f"download/{encoded_tag}/"
                      f"{encoded_name}"
                  ),
                  "size": path.stat().st_size,
                  "content_type": content_type,
                  "digest": (
                      f"sha256:{sha256(path)}"
                  ),
              }

          now = (
              datetime.now(timezone.utc)
              .isoformat()
              .replace("+00:00", "Z")
          )

          preview_release = {
              "tag_name": source_tag,
              "name": f"NeuroMita {source_tag}",
              "body": (
                  promote_dir /
                  "RELEASE_BODY.md"
              ).read_text(
                  encoding="utf-8"
              ),
              # The real release remains a draft.
              # This synthetic object is non-draft ONLY
              # so the normal manifest builder can show
              # what the catalog will look like after Publish.
              "draft": False,
              "prerelease": False,
              "created_at": now,
              "published_at": now,
              "html_url": (
                  f"https://github.com/"
                  f"{repository}/releases/tag/"
                  f"{urllib.parse.quote(source_tag, safe='')}"
              ),
              "assets": [
                  local_asset(
                      os.environ["PYTHON_NAME"],
                      "application/zip",
                  ),
                  local_asset(
                      os.environ["UNITY_NAME"],
                      "application/zip",
                  ),
                  local_asset(
                      "promoted-archive.sha256",
                      "text/plain",
                  ),
              ],
          }

          preview_input = releases + [
              preview_release
          ]

          manifest = build_release_manifest(
              repository,
              preview_input,
              stable_tag=source_tag,
          )

          if (
              manifest.get("channels", {})
              .get("stable")
              != source_tag
          ):
              raise SystemExit(
                  "Preview manifest did not "
                  "select the promoted draft "
                  "as the stable channel"
              )

          preview_entries = [
              release
              for release in manifest.get(
                  "releases",
                  [],
              )
              if release.get("tag_name")
              == source_tag
          ]

          if len(preview_entries) != 1:
              raise SystemExit(
                  "Preview manifest does not "
                  "contain exactly one promoted "
                  "release entry"
              )

          expected_assets = {
              os.environ["PYTHON_NAME"],
              os.environ["UNITY_NAME"],
              "promoted-archive.sha256",
          }

          actual_assets = {
              asset.get("name")
              for asset
              in preview_entries[0].get(
                  "assets",
                  [],
              )
          }

          if not expected_assets.issubset(
              actual_assets
          ):
              raise SystemExit(
                  "Preview manifest is missing "
                  "promoted assets: "
                  f"{sorted(expected_assets - actual_assets)}"
              )

          # Validate with the same parser the updater uses.
          parse_release_manifest(
              manifest,
              expected_repository=repository,
          )

          output = (
              promote_dir /
              "releases-manifest.json"
          )

          output.write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          print(
              "Preview manifest built: "
              f"stable={source_tag}, "
              f"releases="
              f"{len(manifest['releases'])}"
          )
          print(
              "The URLs for the new version "
              "are preview URLs and become live "
              "only after the draft is published."
          )
          PY

      - name: Merge tested Atm4x commit into VinerX/main
        id: merge
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          BASE_COMMIT: ${{ steps.base.outputs.commit }}
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" != "$BASE_COMMIT" ]; then
            echo "Local VinerX HEAD moved away from the validated base commit."
            exit 1
          fi

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "VinerX working tree is unexpectedly dirty before merge."
            git status --short
            exit 1
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Fetching tested tag $SOURCE_TAG from $SOURCE_REPO..."

          git fetch \
            --force \
            --no-tags \
            "https://github.com/${SOURCE_REPO}.git" \
            "refs/tags/${SOURCE_TAG}"

          FETCHED_COMMIT="$(
            git rev-parse 'FETCH_HEAD^{commit}'
          )"

          if [ "$FETCHED_COMMIT" != "$SOURCE_COMMIT" ]; then
            echo "Fetched Atm4x tag does not match the release resolved earlier."
            echo "Expected: $SOURCE_COMMIT"
            echo "Fetched:  $FETCHED_COMMIT"
            exit 1
          fi

          MATCHES=()

          while IFS= read -r candidate; do
            PARENTS="$(
              git show \
                -s \
                --format=%P \
                "$candidate"
            )"

            read -r \
              FIRST_PARENT \
              SECOND_PARENT \
              EXTRA_PARENT \
              <<< "$PARENTS"

            if [ -n "${FIRST_PARENT:-}" ] \
                && [ "${SECOND_PARENT:-}" = "$SOURCE_COMMIT" ] \
                && [ -z "${EXTRA_PARENT:-}" ]; then

              MATCHES+=("$candidate")
            fi

          done < <(
            git rev-list \
              --first-parent \
              --merges \
              "$BASE_COMMIT"
          )

          if [ "${#MATCHES[@]}" -gt 1 ]; then
            echo "More than one promotion-like merge directly references $SOURCE_COMMIT."
            printf '  %s\n' "${MATCHES[@]}"
            echo "Refusing to guess which commit should be released."
            exit 1
          fi

          if [ "${#MATCHES[@]}" -eq 1 ]; then
            RELEASE_COMMIT="${MATCHES[0]}"
            NEEDS_PUSH="false"

            echo "Found existing promotion merge from an earlier run:"
            echo "$RELEASE_COMMIT"

          elif git merge-base \
              --is-ancestor \
              "$SOURCE_COMMIT" \
              "$BASE_COMMIT"; then

            echo "The tested source commit is already contained in VinerX/main,"
            echo "but no direct two-parent promotion merge was found."
            echo "Refusing to guess which VinerX commit should be released."
            exit 1

          else
            git merge \
              --no-ff \
              "$SOURCE_COMMIT" \
              -m "Promote tested Atm4x release $SOURCE_TAG"

            RELEASE_COMMIT="$(
              git rev-parse HEAD
            )"

            PARENTS="$(
              git show \
                -s \
                --format=%P \
                "$RELEASE_COMMIT"
            )"

            read -r \
              FIRST_PARENT \
              SECOND_PARENT \
              EXTRA_PARENT \
              <<< "$PARENTS"

            if [ "$FIRST_PARENT" != "$BASE_COMMIT" ] \
                || [ "$SECOND_PARENT" != "$SOURCE_COMMIT" ] \
                || [ -n "${EXTRA_PARENT:-}" ]; then

              echo "Unexpected merge structure."
              echo "Release commit: $RELEASE_COMMIT"
              echo "Parents: $PARENTS"
              exit 1
            fi

            NEEDS_PUSH="true"
          fi

          echo "base_commit=$BASE_COMMIT" \
            >> "$GITHUB_OUTPUT"

          echo "release_commit=$RELEASE_COMMIT" \
            >> "$GITHUB_OUTPUT"

          echo "needs_push=$NEEDS_PUSH" \
            >> "$GITHUB_OUTPUT"

          echo "Base VinerX commit: $BASE_COMMIT"
          echo "Release commit:      $RELEASE_COMMIT"
          echo "Needs push:          $NEEDS_PUSH"

      - name: Push promoted merge to VinerX/main
        if: steps.merge.outputs.needs_push == 'true'
        shell: bash
        env:
          BASE_COMMIT: ${{ steps.merge.outputs.base_commit }}
          RELEASE_COMMIT: ${{ steps.merge.outputs.release_commit }}
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]; then
            echo "Local HEAD changed unexpectedly before push."
            exit 1
          fi

          git fetch \
            --no-tags \
            origin \
            main

          REMOTE_HEAD="$(
            git rev-parse origin/main
          )"

          if [ "$REMOTE_HEAD" != "$BASE_COMMIT" ]; then
            echo "VinerX/main changed while Promote was running."
            echo "Expected remote HEAD: $BASE_COMMIT"
            echo "Actual remote HEAD:   $REMOTE_HEAD"
            echo "Nothing was pushed."
            echo "Rerun Promote against the new main."
            exit 1
          fi

          git push \
            origin \
            HEAD:refs/heads/main

      - name: Verify promoted commit is on VinerX/main
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.merge.outputs.release_commit }}
        run: |
          set -euo pipefail

          git fetch \
            --no-tags \
            origin \
            main

          if ! git merge-base \
              --is-ancestor \
              "$RELEASE_COMMIT" \
              origin/main; then

            echo "Promotion commit $RELEASE_COMMIT "
            echo "is not reachable from VinerX/main."
            exit 1
          fi

          echo "Verified promotion commit on VinerX/main:"
          echo "$RELEASE_COMMIT"

      - name: Create VinerX draft release
        id: draft_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.source.outputs.source_tag }}
          target_commitish: ${{ steps.merge.outputs.release_commit }}
          name: NeuroMita ${{ steps.source.outputs.source_tag }}
          body_path: ${{ steps.workspace.outputs.dir }}/RELEASE_BODY.md
          files: |
            ${{ steps.workspace.outputs.dir }}/${{ steps.source.outputs.python_name }}
            ${{ steps.workspace.outputs.dir }}/${{ steps.source.outputs.unity_name }}
            ${{ steps.workspace.outputs.dir }}/promoted-archive.sha256
            ${{ steps.workspace.outputs.dir }}/releases-manifest.json
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report draft release
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          RELEASE_COMMIT: ${{ steps.merge.outputs.release_commit }}
          DRAFT_URL: ${{ steps.draft_release.outputs.url }}
        run: |
          set -euo pipefail

          {
            echo "## Promote complete"
            echo
            echo "- Draft release: [$SOURCE_TAG]($DRAFT_URL)"
            echo "- Release commit: \`$RELEASE_COMMIT\`"
            echo "- Python archive: release contour, tested .pyz unchanged"
            echo "- Unity archive: password removed, file contents verified"
            echo "- releases-manifest.json: preview attached to the draft"
            echo "- Nothing has been published yet"
            echo
            echo "Edit/check the draft, then publish it manually."
            echo "After manual Publish, release-manifest.yml will rebuild"
            echo "the canonical releases-manifest.json and upload it with --clobber."
          } >> "$GITHUB_STEP_SUMMARY"
