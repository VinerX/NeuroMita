name: Discord Release Notify

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег релиза (оставь пустым — возьмёт последний)'
        required: false
        type: string
      release_name:
        description: 'Название (например NeuroMita v2026.06.22.1)'
        required: false
        type: string
      release_body:
        description: 'Changelog (Markdown)'
        required: false
        type: string
      release_url:
        description: 'URL релиза'
        required: false
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_NAME: ${{ github.event.release.name || inputs.release_name || '' }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || '' }}
          RELEASE_URL: ${{ github.event.release.html_url || inputs.release_url || '' }}
          RELEASE_BODY: ${{ github.event.release.body || inputs.release_body || '' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook_url:
              print("DISCORD_WEBHOOK_URL is not configured.", file=sys.stderr)
              sys.exit(1)

          release_name = (os.environ.get("RELEASE_NAME") or "").strip()
          release_tag = (os.environ.get("RELEASE_TAG") or "").strip()
          release_url = (os.environ.get("RELEASE_URL") or "").strip()
          release_body = (os.environ.get("RELEASE_BODY") or "").strip()

          # Авто-поиск последнего релиза, если поля не заполнены (ручной запуск)
          if not release_tag or not release_url:
              token = (os.environ.get("GITHUB_TOKEN") or "").strip()
              repo = (os.environ.get("GITHUB_REPOSITORY") or "").strip()
              if token and repo:
                  api_url = f"https://api.github.com/repos/{repo}/releases/latest"
                  req = urllib.request.Request(
                      api_url,
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  try:
                      with urllib.request.urlopen(req) as resp:
                          latest = json.loads(resp.read().decode("utf-8"))
                      if not release_tag:
                          release_tag = (latest.get("tag_name") or "").strip()
                      if not release_url:
                          release_url = (latest.get("html_url") or "").strip()
                      if not release_name:
                          release_name = (latest.get("name") or "").strip()
                      if not release_body:
                          release_body = (latest.get("body") or "").strip()
                      print(f"Auto-discovered latest release: {release_tag}")
                  except Exception as e:
                      print(f"Failed to fetch latest release: {e}", file=sys.stderr)

          title = release_name or release_tag or "New release"
          description_limit = 4000
          if len(release_body) > description_limit:
              release_body = release_body[: description_limit - 3].rstrip() + "..."

          embed = {
              "title": title,
              "url": release_url,
              "description": release_body or "No release notes provided.",
              "color": 5814783,
              "fields": [
                  {
                      "name": "Tag",
                      "value": release_tag or "unknown",
                      "inline": True,
                  }
              ],
          }

          payload = {
              "content": f"Published release: **{title}**\n{release_url}",
              "embeds": [embed],
              "allowed_mentions": {"parse": []},
          }

          request = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request) as response:
              print(f"Discord webhook responded with HTTP {response.status}")
          PY
