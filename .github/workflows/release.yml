name: Build & Release

on:
  push:
    branches:
      - releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    concurrency:
      group: release-manifest-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Полная история + теги нужны для changelog (git describe / git log).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install release tooling
        shell: bash
        run: python -m pip install py7zr

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Launcher.exe
        shell: cmd
        run: |
          rc /nologo /fo scripts\launcher.res scripts\launcher.rc
          cl /nologo /W4 /O2 /utf-8 /Fe:scripts\Launcher.exe scripts\launcher.c scripts\launcher.res
          del /q scripts\launcher.res

      - name: Get version
        id: ver
        shell: bash
        run: |
          VERSION=$(python -c "
          with open('src/_version.py', encoding='utf-8') as f:
              exec(f.read())
          print(__version__)
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Resolve release or in-place revision
        id: release_meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ steps.ver.outputs.version }}
        run: >
          python scripts/publish_python_revision.py plan
          --repository "${{ github.repository }}"
          --version "$BUILD_VERSION"

      - name: Restore embedded Python runtime from previous full release
        if: steps.release_meta.outputs.should_release == 'true'
        shell: bash
        run: >
          python scripts/bootstrap_release_runtime.py
          --repo "${{ github.repository }}"
          --before-tag "v${{ steps.ver.outputs.version }}"
          --exclude-tag "v${{ steps.ver.outputs.version }}"
          --target libs
        env:
          # TEMPORARY TEST-ONLY HARDCODE: move this value into repo secret TESTER_CODE
          # as soon as repository settings access is available again.
          BOOTSTRAP_TESTER_CODE: '23'
          PYTHONUTF8: '1'
        # Берётся последний доступный full runtime со строго меньшей версией тега.
        # Архивы старых релизов могут быть зашифрованы, поэтому CI передаёт TESTER_CODE.

      - name: Verify embedded Python runtime
        if: steps.release_meta.outputs.should_release == 'true'
        shell: bash
        run: |
          test -f "libs/python/python.exe" || {
            echo "Embedded runtime bootstrap failed: libs/python/python.exe is missing."
            exit 1
          }

      - name: Create build.env
        if: steps.release_meta.outputs.should_release == 'true'
        shell: python
        run: |
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          version   = os.environ["VERSION"]
          output    = runner_temp / "neuromita_ci_build"
          archive   = workspace / f"PythonBuild-v{version}"

          content = "\n".join([
              f"BUILD_MODE=full",
              f"BUILD_IS_TEST=1",
              f"BUILD_OUTPUT_DIR={output}",
              f"BUILD_COPY_DIRS=extra\\Prompts,assets,libs",
              f"BUILD_FAST_COPY_DIRS=extra\\Prompts",
              f"BUILD_COPY_FILES=NM_Logo.ico,assets\\launcher_ui\\NM_Logo.png",
              f"BUILD_ROOT_SCRIPTS=scripts\\Launcher.exe,scripts\\run.bat,scripts\\run.py",
              f"BUILD_EXCLUDE_DOT_DIRS=1",
              f"BUILD_EXCLUDE_CHECKPOINTS=1",
              f"BUILD_CLEAN_OUTPUT=1",
              f"BUILD_ARCHIVE=1",
              f"BUILD_ARCHIVE_PATH={archive}",
              f"BUILD_ARCHIVE_FORMAT=zip",
          ])
          Path("build.env").write_text(content, encoding="utf-8")
          print("build.env created:")
          print(content)
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Build
        if: steps.release_meta.outputs.should_release == 'true'
        shell: bash
        run: python build.py
        env:
          PYTHONUTF8: '1'

      - name: Stamp test distribution metadata
        if: steps.release_meta.outputs.should_release == 'true'
        shell: bash
        run: >
          python scripts/stamp_distribution_metadata.py
          --archive "PythonBuild-v${{ steps.ver.outputs.version }}.zip"
          --contour test
          --source-repo "${{ github.repository }}"
          --source-tag "${{ steps.release_meta.outputs.release_tag }}"
          --source-commit "${{ github.sha }}"
        env:
          PYTHONUTF8: '1'

      - name: Validate release contract
        if: steps.release_meta.outputs.should_release == 'true'
        shell: bash
        run: python scripts/validate_release_contract.py --tag v${{ steps.ver.outputs.version }} --asset PythonBuild-v${{ steps.ver.outputs.version }}.zip
        env:
          PYTHONUTF8: '1'

      - name: Build changelog
        if: steps.release_meta.outputs.should_release == 'true' && steps.release_meta.outputs.publication_mode == 'release'
        shell: bash
        run: |
          python scripts/build_release_changelog.py \
            --current-tag "${{ steps.release_meta.outputs.current_tag }}" \
            --output CHANGELOG_BODY.md

      - name: Create GitHub Release
        if: steps.release_meta.outputs.should_release == 'true' && steps.release_meta.outputs.publication_mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: NeuroMita v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG_BODY.md
          files: PythonBuild-v${{ steps.ver.outputs.version }}.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace the Python archive in the existing release
        if: steps.release_meta.outputs.publication_mode == 'revision' && (steps.release_meta.outputs.should_release == 'true' || steps.release_meta.outputs.recover_revision == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ steps.ver.outputs.version }}
        run: >
          python scripts/publish_python_revision.py publish
          --repository "${{ github.repository }}"
          --version "$BUILD_VERSION"
          --archive "PythonBuild-v${BUILD_VERSION}.zip"

      - name: Rebuild the compatible release manifest
        id: manifest
        if: steps.release_meta.outputs.should_release == 'true' || steps.release_meta.outputs.recover_revision == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          python scripts/build_release_manifest.py
          --repository "${{ github.repository }}"
          --api-base "${{ github.api_url }}"
          --output releases-manifest.json

      - name: Publish the manifest to the real latest release
        if: steps.manifest.outputs.stable_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ steps.manifest.outputs.stable_tag }}
        run: >
          gh release upload "$STABLE_TAG" releases-manifest.json
          --repo "${{ github.repository }}" --clobber
