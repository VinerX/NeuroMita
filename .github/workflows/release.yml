name: Build & Release

on:
  push:
    branches:
      - releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version
        id: ver
        shell: bash
        run: |
          VERSION=$(python -c "
          with open('src/_version.py', encoding='utf-8') as f:
              exec(f.read())
          print(__version__)
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create build.env
        shell: python
        run: |
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          version   = os.environ["VERSION"]
          output    = runner_temp / "neuromita_ci_build"
          archive   = workspace / f"PythonBuild-v{version}"

          content = "\n".join([
              f"BUILD_MODE=full",
              f"BUILD_OUTPUT_DIR={output}",
              f"BUILD_COPY_DIRS=extra\\Prompts,assets,libs",
              f"BUILD_FAST_COPY_DIRS=extra\\Prompts",
              f"BUILD_COPY_FILES=extra\\init.py,extra\\Icon.png",
              f"BUILD_ROOT_SCRIPTS=scripts\\run.bat,scripts\\run.py,scripts\\init_triton.bat",
              f"BUILD_EXCLUDE_DOT_DIRS=1",
              f"BUILD_EXCLUDE_CHECKPOINTS=1",
              f"BUILD_CLEAN_OUTPUT=1",
              f"BUILD_ARCHIVE=1",
              f"BUILD_ARCHIVE_PATH={archive}",
              f"BUILD_ARCHIVE_FORMAT=zip",
          ])
          Path("build.env").write_text(content, encoding="utf-8")
          print("build.env created:")
          print(content)
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Build
        shell: bash
        run: python build.py
        env:
          PYTHONUTF8: '1'

      - name: Validate release contract
        shell: bash
        run: python scripts/validate_release_contract.py --tag v${{ steps.ver.outputs.version }} --asset PythonBuild-v${{ steps.ver.outputs.version }}.zip
        env:
          PYTHONUTF8: '1'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: NeuroMita v${{ steps.ver.outputs.version }}
          body: |
            Automated build from `releases` branch.

            **Install:** extract the archive over your existing installation.
          files: PythonBuild-v${{ steps.ver.outputs.version }}.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
