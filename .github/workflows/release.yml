name: Build & Release

on:
  push:
    branches:
      - releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Полная история + теги нужны для changelog (git describe / git log).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install release tooling
        shell: bash
        run: python -m pip install py7zr

      - name: Get version
        id: ver
        shell: bash
        run: |
          VERSION=$(python -c "
          with open('src/_version.py', encoding='utf-8') as f:
              exec(f.read())
          print(__version__)
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Resolve release tags
        id: release_meta
        shell: bash
        run: |
          RELEASE_TAG_PATTERN='^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'
          CURRENT_TAG="v${{ steps.ver.outputs.version }}"
          if ! printf '%s\n' "$CURRENT_TAG" | grep -Eq "$RELEASE_TAG_PATTERN"; then
            echo "Unsupported release tag format: $CURRENT_TAG"
            echo "Expected tags like v2026.06.20 or v2026.06.20.1."
            exit 1
          fi

          list_release_tags() {
            git tag --list 'v*' --sort=-version:refname \
              | grep -E "$RELEASE_TAG_PATTERN" \
              || true
          }

          LATEST_TAG=$(
            list_release_tags | head -n1
          )

          SHOULD_RELEASE="true"
          SKIP_REASON=""
          PREV_TAG="${LATEST_TAG}"

          if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" = "$CURRENT_TAG" ]; then
            SHOULD_RELEASE="false"
            SKIP_REASON="version-already-released"
            PREV_TAG=$(
              list_release_tags \
                | grep -vxF "$CURRENT_TAG" \
                | head -n1 \
                || true
            )
          elif [ -n "$LATEST_TAG" ]; then
            TOP_TAG=$(
              printf '%s\n%s\n' "$LATEST_TAG" "$CURRENT_TAG" \
                | sort -V \
                | tail -n1
            )
            if [ "$TOP_TAG" != "$CURRENT_TAG" ]; then
              SHOULD_RELEASE="false"
              SKIP_REASON="version-not-newer-than-latest"
            fi
          fi

          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
          echo "skip_reason=$SKIP_REASON" >> $GITHUB_OUTPUT

          echo "Current tag: ${CURRENT_TAG}"
          echo "Latest existing release tag: ${LATEST_TAG:-<none>}"
          echo "Previous tag for changelog: ${PREV_TAG:-<none>}"
          echo "Should release: ${SHOULD_RELEASE}"
          echo "Skip reason: ${SKIP_REASON:-<none>}"

      - name: Skip duplicate release version
        if: steps.release_meta.outputs.should_release != 'true'
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.ver.outputs.version }}
          LATEST_TAG: ${{ steps.release_meta.outputs.latest_tag }}
          SKIP_REASON: ${{ steps.release_meta.outputs.skip_reason }}
        run: |
          if [ "$SKIP_REASON" = "version-already-released" ]; then
            echo "Release skipped: src/_version.py is still ${CURRENT_VERSION}, which already exists as tag ${LATEST_TAG}."
          elif [ "$SKIP_REASON" = "version-not-newer-than-latest" ]; then
            echo "Release skipped: src/_version.py is ${CURRENT_VERSION}, which is not newer than the latest release tag ${LATEST_TAG}."
          else
            echo "Release skipped."
          fi

      - name: Restore embedded Python runtime from previous full release
        if: steps.release_meta.outputs.should_release == 'true'
        shell: bash
        run: >
          python scripts/bootstrap_release_runtime.py
          --repo "${{ github.repository }}"
          --prefer-tag "v2026.06.12_Full"
          --exclude-tag "v${{ steps.ver.outputs.version }}"
          --target libs
        env:
          # TEMPORARY TEST-ONLY HARDCODE: move this value into repo secret TESTER_CODE
          # as soon as repository settings access is available again.
          BOOTSTRAP_TESTER_CODE: '23'
          PYTHONUTF8: '1'
        # TEMPORARY: pin the baseline runtime to the known-small v2026.06.12_Full release.
        # That legacy asset is password-protected, so CI must receive TESTER_CODE to unpack it.
        # Replace this with a dedicated canonical runtime asset/release after release testing.

      - name: Verify embedded Python runtime
        if: steps.release_meta.outputs.should_release == 'true'
        shell: bash
        run: |
          test -f "libs/python/python.exe" || {
            echo "Embedded runtime bootstrap failed: libs/python/python.exe is missing."
            exit 1
          }

      - name: Create build.env
        if: steps.release_meta.outputs.should_release == 'true'
        shell: python
        run: |
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          version   = os.environ["VERSION"]
          output    = runner_temp / "neuromita_ci_build"
          archive   = workspace / f"PythonBuild-v{version}"

          content = "\n".join([
              f"BUILD_MODE=full",
              f"BUILD_OUTPUT_DIR={output}",
              f"BUILD_COPY_DIRS=extra\\Prompts,assets,libs",
              f"BUILD_FAST_COPY_DIRS=extra\\Prompts",
              f"BUILD_COPY_FILES=extra\\init.py,extra\\Icon.png",
              f"BUILD_ROOT_SCRIPTS=scripts\\run.bat,scripts\\run.py,scripts\\init_triton.bat",
              f"BUILD_EXCLUDE_DOT_DIRS=1",
              f"BUILD_EXCLUDE_CHECKPOINTS=1",
              f"BUILD_CLEAN_OUTPUT=1",
              f"BUILD_ARCHIVE=1",
              f"BUILD_ARCHIVE_PATH={archive}",
              f"BUILD_ARCHIVE_FORMAT=zip",
          ])
          Path("build.env").write_text(content, encoding="utf-8")
          print("build.env created:")
          print(content)
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Build
        if: steps.release_meta.outputs.should_release == 'true'
        shell: bash
        run: python build.py
        env:
          PYTHONUTF8: '1'

      - name: Validate release contract
        if: steps.release_meta.outputs.should_release == 'true'
        shell: bash
        run: python scripts/validate_release_contract.py --tag v${{ steps.ver.outputs.version }} --asset PythonBuild-v${{ steps.ver.outputs.version }}.zip
        env:
          PYTHONUTF8: '1'

      - name: Build changelog
        if: steps.release_meta.outputs.should_release == 'true'
        shell: bash
        run: |
          CURRENT_TAG="${{ steps.release_meta.outputs.current_tag }}"
          PREV="${{ steps.release_meta.outputs.previous_tag }}"
          RANGE="${PREV:+$PREV..}HEAD"
          echo "Current tag: ${CURRENT_TAG}"
          echo "Previous release tag: ${PREV:-<none>} (range: $RANGE)"

          # Чистый список: без merge-коммитов и служебного шума (bump версии,
          # CI-правки релиза и т.п.). Берём диапазон от последнего обычного
          # релизного тега по версии, а не только от тега, который merged в HEAD:
          # часть релизов создаётся вручную и может не попадать в ancestry-фильтр.
          LOG=$(git log $RANGE --no-merges --pretty=format:'- %s (%h)' \
            | grep -viE '(_version|\bbump\b|version bump|\[skip ci\]|tester code|release workflow|github actions?)' \
            || true)

          {
            echo "Установка: распакуйте архив поверх установленной версии."
            echo ""
            if [ -n "$PREV" ]; then
              echo "Изменения с ${PREV}"
            else
              echo "Изменения"
            fi
            if [ -n "$LOG" ]; then
              echo "$LOG"
            else
              echo "- Технические улучшения и исправления."
            fi
          } > CHANGELOG_BODY.md

          echo "----- CHANGELOG_BODY.md -----"
          cat CHANGELOG_BODY.md

      - name: Create GitHub Release
        if: steps.release_meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: NeuroMita v${{ steps.ver.outputs.version }}
          body_path: CHANGELOG_BODY.md
          files: PythonBuild-v${{ steps.ver.outputs.version }}.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
